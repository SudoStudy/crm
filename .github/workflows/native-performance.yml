name: Native Performance

on:
  pull_request:
    paths:
      - 'crm/api/performance.py'
      - 'crm/performance/**'
      - 'crm/permissions/sales_targets.py'
      - 'crm/hooks.py'
      - 'crm/patches/v1_0/native_performance_targets.py'
      - 'crm/patches.txt'
      - 'frontend/**'
      - '.github/workflows/native-performance.yml'
  push:
    branches: ['codex/native-performance']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-performance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Performance calculations and permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Offline performance tests
        run: python -m unittest discover -s crm/performance/tests -v
      - name: Compile Python
        run: python -m compileall -q crm/api/performance.py crm/performance crm/patches/v1_0/native_performance_targets.py

  frontend:
    name: CRM unit tests and production assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: crm
      - name: Match the deployed Frappe UI dependency
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: c1f1e8ec3708750d7254f7f99d869ffb9886f19f
          path: frappe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: crm/frontend/yarn.lock
      - name: Install locked dependencies
        working-directory: crm/frontend
        run: yarn install --frozen-lockfile
      - name: Run offline unit and component tests
        working-directory: crm/frontend
        run: yarn test:run
      - name: Build deployable assets
        working-directory: crm/frontend
        run: yarn build

  integration:
    name: Native Frappe permissions and transactions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated test site
        uses: ./.github/actions/setup-server-env
        with:
          python-version: '3.14'
          node-version: '24'
          frappe-branch: version-16
          install-erpnext: 'false'
      - name: Apply native schema on the test site
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site execute crm.patches.v1_0.native_performance_targets.execute
      - name: Test framework permissions, task history and concurrent saves
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --module crm.performance.integration.test_performance
